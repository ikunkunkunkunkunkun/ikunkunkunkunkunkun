name: Generate GitHub metrics

on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Render profile and activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ikunkunkunkunkunkun
          template: classic
          base: header, activity, community, repositories, metadata
          repositories_forks: yes
          config_display: compact
          config_timezone: Asia/Shanghai
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata
          filename: metrics-profile.svg
          plugins_errors_fatal: no

      - name: Render languages and contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ikunkunkunkunkunkun
          template: classic
          base: ""
          repositories_forks: yes
          config_display: compact
          config_timezone: Asia/Shanghai
          config_order: languages, isocalendar
          filename: metrics-insights.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_details: bytes-size, percentage
          plugins_errors_fatal: no
