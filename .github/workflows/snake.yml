name: Generate contribution snake

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate snake from the same rolling-year contribution data
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node scripts/generate-public-snake.mjs
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
